version: "3"

tasks:
  dev:
    desc: Run FastAPI dev server with auto-reload.
    cmds:
      - uv run uvicorn guidloc.main:app --reload --host 0.0.0.0 --port 8000

  test:
    desc: Run the test suite.
    cmds:
      - uv run pytest

  lint:
    desc: Run ruff linter.
    cmds:
      - uv run ruff check .

  format:
    desc: Format code and auto-fix lint issues.
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix

  migrate:
    desc: Apply all pending Alembic migrations.
    cmds:
      - uv run alembic upgrade head

  migration:
    desc: 'Create a new autogenerated Alembic revision. Usage: task migration -- "message"'
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  db-reset:
    desc: Drop the local SQLite database and re-apply all migrations.
    cmds:
      - rm -f guidloc.db
      - uv run alembic upgrade head